name: Build NTPC Leave Planner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi
          echo "Using $ZIP_FILE"
          mkdir android-project
          unzip -q "$ZIP_FILE" -d android-project
          echo "Extracted project:"
          find android-project -maxdepth 3 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        run: find android-project -name '*.apk' -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NTPC-Leave-Planner-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          
